services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: stage
      POSTGRES_PASSWORD: stage
      POSTGRES_DB: stageready
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stage -d stageready"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # MinIO's own image left Docker Hub in 2025; this is the last Bitnami build, pinned.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: stage-ready
      MINIO_ROOT_PASSWORD: stage-ready-secret
      MINIO_DEFAULT_BUCKETS: stage-ready
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/bitnami/minio/data"]
volumes:
  postgres-data:
  minio-data:
