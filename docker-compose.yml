services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: stage
      POSTGRES_PASSWORD: stage
      POSTGRES_DB: stageready
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stage -d stageready"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: stage-ready
      MINIO_ROOT_PASSWORD: stage-ready-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
volumes:
  postgres-data:
  minio-data:
