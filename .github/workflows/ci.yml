name: CI
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    # Playwright in Demo Mode: no API keys, scripted speech, fake camera and mic.
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: stage
          POSTGRES_PASSWORD: stage
          POSTGRES_DB: stageready
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U stage -d stageready" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm --filter @stage-ready/web exec playwright install --with-deps chromium
      # The vision service renders the Director cut (FFmpeg) and serves transcription.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/vision/requirements.txt
      - run: pip install -r services/vision/requirements.txt
      # S3-compatible storage for takes, slides and renders. MinIO's image is no longer on Docker Hub,
      # so CI uses the moto S3 server (in memory, any credentials; the app creates its bucket).
      - run: pip install "moto[server]==5.1.4"
      - run: |
          nohup moto_server -H 127.0.0.1 -p 9000 > /tmp/s3.log 2>&1 &
          for i in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:9000/ && break; sleep 1; done
      - run: nohup python -m uvicorn app.main:app --port 8000 > /tmp/vision.log 2>&1 &
        working-directory: services/vision
      - run: pnpm --filter @stage-ready/web test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
      - if: failure()
        run: tail -n 200 /tmp/vision.log /tmp/s3.log || true

  vision:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/vision/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
